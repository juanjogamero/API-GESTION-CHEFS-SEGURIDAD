services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simulacro_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [chefs_security_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d simulacro_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chefs_security_db:
